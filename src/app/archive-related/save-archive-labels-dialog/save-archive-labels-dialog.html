<p-dialog 
    [(visible)]="isVisible" 
    [modal]="true" 
    [style]="{ width: '70vw', height: '90vh' }" 
    [maximizable]="true"
    [draggable]="false"
    [resizable]="false"
    (onHide)="onClose()">

    <ng-template pTemplate="header">
        <div class="flex items-center gap-3">
            <i class="pi pi-file-pdf text-red-600 text-2xl"></i>
            <div class="flex flex-col">
                <h1 class="text-xl font-bold m-0">{{titleLabel}}</h1>
                <p class="text-sm text-surface-500 m-0">{{subtitleLabel}}</p>
            </div>
        </div>
    </ng-template>

    <div class="h-full w-full bg-surface-100 dark:bg-surface-900 border-round overflow-hidden border border-surface-200">
        @if (pdfUrl) {
            <iframe 
                [src]="pdfUrl" 
                class="w-full h-full border-none shadow-2"
                title="PDF Preview">
            </iframe>
        } @else {
            <div class="flex flex-col items-center justify-center h-full gap-4 text-surface-400">
                <p-progress-spinner styleClass="w-12 h-12" strokeWidth="4" />
                <p>{{loadingLabel}}</p>
            </div>
        }
    </div>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-3 pt-2">
            <p-button 
                [label]="printButtonLabel" 
                icon="pi pi-print" 
                [outlined]="true" 
                severity="secondary" 
                (onClick)="printPdf()">
            </p-button>
            <p-button 
                [label]="saveButtonLabel" 
                icon="pi pi-download" 
                severity="primary" 
                (onClick)="downloadPdf()">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
