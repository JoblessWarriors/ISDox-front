<p-menubar [model]="navBarOptions">
    <ng-template #start>
        <img
            class="mx-15 mr-30"
            width="120"
            height="15"
            src="logo.png"
            />
    </ng-template>
    <ng-template #end>
        <div class="flex items-center gap-2 mr-2">
            <div class="flex flex-col justify-center items-center mx-4">
                <label>{{ modeLabel }}</label>
                <p-toggleswitch (onChange)="toggleThemePreference()" [(ngModel)]="isDarkMode"/>
            </div>
            <ng-container *ngIf="authService.isLoggedIn()">
            <button #menuButton
                type="button" 
                (click)="menu.toggle($event)" 
                class="p-link flex items-center justify-center p-0 border-none bg-transparent cursor-pointer">
                @if (user?.profileImageUrl) {
                    <p-avatar 
                    [image]="user?.profileImageUrl!"
                    shape="circle" />
                }
                @else {
                    <p-avatar 
                        [label]="(user?.firstName?.charAt(0) || '') + (user?.lastName?.charAt(0) || '')" 
                        shape="circle"/>
                }
            </button>
            <p-menu #menu [model]="userMenuItems" [popup]="true"></p-menu>
        </ng-container>
        </div>
    </ng-template>
</p-menubar>
