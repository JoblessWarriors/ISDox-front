<div class="flex m-12">
  <p-card class="w-full mx-16">
    <div class="my-16 flex flex-col items-center">
        <h1 class="text-4xl m-2">
          <strong>{{titleLabel}}</strong>
        </h1>
        <p class="text-center mx-10 mt-3">{{subtitleLabel}}</p>
    </div>
    <div class="w-full flex justify-center mt-0 pt-0">
      <p-fileUpload 
        mode="advanced"
        [chooseLabel]="chooseButtonLabel"
        [uploadLabel]="uploadButtonLabel"
        [cancelLabel]="cancelButtonLabel"
        [customUpload]="true"
        name="demo[]"
        accept="application/pdf,image/*" 
        maxFileSize="1000000"
        (uploadHandler)="onUpload($event)"
        styleClass="p-button-lg p-button-raised">
      </p-fileUpload>
    </div>

    <div class="my-4 mx-40 p-3 border-round border-1">
      <p class="text-sm text-700 m-0">
        <i class="pi pi-exclamation-triangle mr-2"></i>
        <strong>{{attentionLabel}}</strong>
        {{disclaimerLabel}}
      </p>
    </div>

  </p-card>
</div>
