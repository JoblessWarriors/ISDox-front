<div class="card m-12">
    <p-tabs [(value)]="activeTabIndex">
        <p-tablist class="flex items-center">
        <p-tab [value]="0">{{usersTabLabel}}</p-tab>
        <p-tab [value]="1">{{departmentsTabLabel}}</p-tab>

        <div class="ml-auto pr-2 m-3">
            @if (activeTabIndex == 0) {
                <p-button 
                [label]="addUserLabel" 
                icon="pi pi-plus" 
                [outlined]="true" 
                severity="primary" 
                size="small"
                (click)="createUser()" />
            }
            @else {
                <p-button 
                [label]="addDepartmentLabel" 
                icon="pi pi-plus" 
                [outlined]="true" 
                severity="primary" 
                size="small"
                (click)="null" />
            }
            
        </div>
    </p-tablist>
        <p-tabpanels>
            <p-tabpanel [value]="0">
                <p-dataview #dv [value]="users">
                    <ng-template #list let-items>
                        <div class="grid grid-cols-12 gap-4 grid-nogutter">
                            <div class="col-span-12" *ngFor="let user of items; let first = first">
                                <div class="flex flex-col sm:flex-row sm:items-center p-6 gap-4" 
                                    [ngClass]="{ 'border-t border-surface-200 dark:border-surface-700': !first }">
                                    
                                    <div class="md:w-40 relative">
                                        <img class="block mx-auto rounded-full w-24 h-24 object-cover border-2 border-surface-200" 
                                            [src]="'https://api.dicebear.com/7.x/avataaars/svg?seed=' + user.email" 
                                            [alt]="user.firstName" />
                                        <p-tag 
                                            [value]="user.isActive ?  activeUserLabel : inactiveUserLabel" 
                                            [severity]="user.isActive ? 'success' : 'danger'" 
                                            class="absolute" 
                                            [style]="{ left: '4px', top: '4px' }" />
                                    </div>

                                    <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
                                        <div class="flex flex-col justify-between items-start gap-2">
                                            <div>
                                                <span class="font-medium text-secondary text-sm uppercase">
                                                    {{ user.departments[0]?.name || 'No Department' }}
                                                </span>
                                                <div class="text-xl font-bold text-surface-900 dark:text-surface-0 mt-1">
                                                    {{ user.firstName }} {{ user.lastName }}
                                                </div>
                                                <div class="flex gap-2 mt-2">
                                                    <p-chip *ngFor="let role of user.roles" [label]="(role | userRoleDescription | async)!" styleClass="text-xs"></p-chip>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="flex flex-col md:items-end gap-5">
                                            <span class="text-sm font-medium text-surface-500">{{ user.email }}</span>
                                            <div class="flex flex-row gap-2">
                                                <p-button icon="pi pi-user-edit" [outlined]="true" severity="secondary" [label]="editButtonLabel" (onClick)="editUser(user)" />
                                                <p-button icon="pi pi-trash" severity="danger" [label]="deleteButtonLabel" (onClick)="deleteUser(user)" />
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </ng-template>
                </p-dataview>
            </p-tabpanel>

            <p-tabpanel [value]="1"></p-tabpanel>
        </p-tabpanels>
    </p-tabs>
</div>
<app-admin-edit-dialog
    [isVisible]="openEditUserDialog"
    [user]="selectedUser"
    (closeModal)="openEditUserDialog=$event"
    (editedUserEmitter)="editedUserEvent($event)"
></app-admin-edit-dialog>
<app-admin-create-dialog
    [isVisible]="openCreateUserDialog"
    (closeModal)="openCreateUserDialog=$event"
    (createdUserEmitter)="createdUserEvent($event)"
></app-admin-create-dialog>
<p-confirmdialog />
